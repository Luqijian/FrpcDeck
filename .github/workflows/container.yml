name: Container image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: luqijian/frpcdeck

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FRP_VERSION=0.71.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Promote release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/luqijian/frpcdeck:latest \
            --tag ghcr.io/luqijian/frpcdeck:main \
            ghcr.io/luqijian/frpcdeck:${{ steps.version.outputs.version }}

      - name: Verify anonymous pull
        run: |
          set -euo pipefail
          token="$(curl -fsSL 'https://ghcr.io/token?scope=repository:luqijian/frpcdeck:pull' | jq -r .token)"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            'https://ghcr.io/v2/luqijian/frpcdeck/manifests/latest')"
          echo "Anonymous manifest status: ${status}"
          test "${status}" = "200"
