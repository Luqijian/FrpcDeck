name: Retag image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retag-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  retag:
    name: Move latest to the current release image
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag latest and main
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag ghcr.io/luqijian/frpcdeck:latest \
            --tag ghcr.io/luqijian/frpcdeck:main \
            ghcr.io/luqijian/frpcdeck:1.1.0
          docker buildx imagetools inspect ghcr.io/luqijian/frpcdeck:latest
