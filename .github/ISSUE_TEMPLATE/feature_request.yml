name: Feature request / 功能建议
description: Suggest a feature or UX improvement / 建议新功能或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: This request is within the scope of managing frpc (not frps).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish? Why is the current experience insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the UI, configuration field or workflow you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, upstream frp documentation, links, etc.
